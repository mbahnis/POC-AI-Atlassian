# Chronologie fictive de la réponse à incident, publiée en commentaires pour la démo.
# "apres" = minutes après le début de l'alerte ; {heure:N} = heure du début de l'alerte + N minutes.
# Les heures sont donc toujours cohérentes, quel que soit le jour de la démo.
# Les prénoms sont volontaires : le post-mortem doit les remplacer par des rôles (principe blameless).
- apres: 5
  texte: "{heure:5} Astreinte (Léa) : alerte prise en compte. Les pods api-commandes redémarrent toutes les 2 minutes (OOMKilled). Les paiements échouent pour une partie des clients."
- apres: 13
  texte: "{heure:13} Astreinte (Léa) : la consommation mémoire monte régulièrement depuis la dernière mise en production. Hypothèse : fuite mémoire dans l'export CSV des commandes, qui charge toutes les commandes en mémoire."
- apres: 20
  texte: "{heure:20} Astreinte (Léa) : mémoire des pods passée de 512 Mo à 1 Go en urgence. Les redémarrages s'arrêtent, les paiements repassent."
- apres: 32
  texte: "{heure:32} Astreinte (Léa) : situation stable depuis 10 minutes, taux d'erreur revenu à la normale. Un export CSV lancé à {heure:-8} par la logistique coïncide avec le début de la hausse."
- apres: 40
  texte: "{heure:40} Dev (Karim) : confirmé, l'export lit toutes les commandes sans pagination. Correctif prévu (lecture par lots). La limite à 1 Go est conservée en attendant."
